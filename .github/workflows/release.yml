name: Release

# Disabled in the starter kit so cloning it cannot publish a release.
# `pnpm scaffold` restores the automatic push trigger.
on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml
  release:
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: pnpm release --ci
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger image build
        run: |
          TAG="$(git tag --list 'v*' --sort=-version:refname | head -1)"
          if [ -z "$TAG" ]; then
            echo "::error::No v* release tag found to build"
            exit 1
          fi
          echo "Dispatching image build for ${TAG}"
          gh workflow run build.yml -f "tag=${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
